<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beefy's Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ffcc00, #ff6699 40%, #000033 100%);
      color: #ffffff;
      font-family: 'Comic Sans MS', 'Marker Felt', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .page {
      padding: 4rem 2rem;
      border: 6px dashed #ffffff;
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
      max-width: 900px;
      margin: 1rem;
    }

    h1 {
      font-size: clamp(3rem, 7vw, 7rem);
      line-height: 1.05;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 2px 2px 0 #000033, -2px -2px 0 #ff66cc;
    }

    p {
      margin: 1.5rem 0 0;
      font-size: 1.5rem;
      letter-spacing: 0.07em;
    }

    .glow {
      display: inline-block;
      padding: 0.3em 0.6em;
      border: 2px solid #ffffff;
      border-radius: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>What up ya'll!<br>I'm Lindsey, aka Beefy.</h1>
    <p class="glow">I'm super well adjusted!</p>
  </div>
</body>
</html>
